name: Tests and Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: "0.12.4"  # pinned uv: makes uv.lock rendering reproducible

      # Ruff version pinned to the dev dependency in pyproject.toml and .pre-commit-config.yaml.
      # Kept as uvx (not uv run) so the lint job stays fast — no full venv.
      - name: Run ruff
        run: |
          uvx ruff@0.16.3 check src tests
          uvx ruff@0.16.3 format --check src tests

      - name: Install just
        uses: ./.github/actions/just-setup

      - name: Lint justfile
        run: just lint-justfile

  tests:
    runs-on: macos-14  # Apple Silicon runner (M1)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # setup-uv subsumes setup-python: UV_PYTHON pins the interpreter,
      # activate-environment creates + PATH-activates .venv for later steps.
      - name: Install uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: "0.12.4"  # pinned uv: makes uv.lock rendering reproducible
          python-version: "3.13"  # newest fully-supported version
          activate-environment: true

      # Lockfile-pinned install (runtime + dev extras incl. pytest): dev/CI parity
      # with `just test`, and --locked fails the job if uv.lock drifts from pyproject.
      # Fresh-PyPI-resolution coverage lives in the py310-smoke leg's dry-run instead.
      - name: Install dependencies
        run: |
          uv sync --all-extras --locked

      - name: Run tests (everything except slow/high_memory_requirement)
        run: |
          python -m pytest -m "not slow and not high_memory_requirement" -v

      # ty version comes from the pinned dev dependency in pyproject.toml (ty==0.0.72)
      # via uv.lock. Runs in this job (not lint) because ty needs the synced venv to
      # resolve imports (mlx, torch, ...) the ubuntu lint job doesn't install, and
      # after pytest so a typing regression can't mask test signal.
      - name: Run ty type checker
        run: |
          uv run --no-sync ty check

  py310-smoke:
    # Cheap floor guard: ruff target-version catches 3.11+ syntax, but not
    # 3.10-incompatible dependency markers or import-time stdlib usage.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.10 (requires-python floor)
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: "0.12.4"
          python-version: "3.10"
          activate-environment: true

      - name: Fresh-resolution + byte-compile under 3.10
        run: |
          # uv-native canary: re-resolve the universal lock against live PyPI
          # (catches range/marker debt for every platform incl. 3.10), no lock mutation
          uv lock --upgrade --dry-run
          python -m compileall -q src

