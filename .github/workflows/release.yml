name: Create Release and Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm release'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0 # Need full history for git operations

      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "publish" ]; then
            echo "❌ Must type 'publish' to confirm release"
            exit 1
          fi

      - name: Install uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: "0.12.4"  # pinned uv: reproducible build behavior
          python-version: "3.13"
          activate-environment: true

      - name: Install dependencies
        run: |
          uv pip install -e . --no-deps
          # ^ the last uv pip call in the repo: uv sync cannot express
          #   "project only, no deps", and the release runner avoids the
          #   multi-GB torch/mlx chain the script never imports
          uv pip install toml requests

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Run release script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MFLUX_TRUSTED_PUBLISHING: "true"
        run: |
          python -m mflux.release.release_script

      - name: Publish package distributions to PyPI
        if: ${{ success() && hashFiles('dist/**') != '' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
