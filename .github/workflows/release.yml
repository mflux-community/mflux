name: Create Release and Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm release'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    # Deployment gate: requires reviewer approval and restricts publishable
    # branches per the environment's protection rules (Settings > Environments > pypi).
    # The PyPI trusted publisher is also pinned to this environment name.
    environment: pypi
    permissions:
      contents: write
      pull-requests: read
      id-token: write

    steps:
      - name: Validate branch
        # Defense in depth: the pypi environment's deployment branch policy is
        # the primary gate; this fails fast with a clear message if dispatched
        # from any ref other than main.
        # $GITHUB_REF is the runner-provided env var: unlike a ${{ }} template
        # expansion, its value never becomes shell source (#646 review, #648).
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "❌ Releases may only be published from main (got $GITHUB_REF)"
            exit 1
          fi

      - name: Validate confirmation
        # The dispatch input is free text; passing it through env keeps it data
        # instead of expanding it into the script (same class as the ref guard).
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "publish" ]; then
            echo "❌ Must type 'publish' to confirm release"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0 # Need full history for git operations

      - name: Install uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: "0.12.4"  # pinned uv: reproducible build behavior
          python-version: "3.13"
          activate-environment: true

      - name: Install dependencies
        run: |
          uv pip install -e . --no-deps
          # ^ the last uv pip call in the repo: uv sync cannot express
          #   "project only, no deps", and the release runner avoids the
          #   multi-GB torch/mlx chain the script never imports
          uv pip install toml requests

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Run release script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MFLUX_TRUSTED_PUBLISHING: "true"
        run: |
          python -m mflux.release.release_script

      - name: Publish package distributions to PyPI
        if: ${{ success() && hashFiles('dist/**') != '' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
