name: Release note

# Its own workflow rather than a job in tests.yml for one reason: `edited` — fixing a
# missing or empty block happens by editing the PR body, and a check that never re-runs
# on a body edit can only be fixed by pushing an empty commit.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  # Every PR must carry a fenced release-note block (or an explicit `none`) in its body;
  # the release draft is harvested from those blocks (#673). The body comes from the event
  # payload file, never template-expanded into the script.
  release-note:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require a complete release-note block in the PR body
        # Mirrors ReleaseNotes._FENCE exactly (keep the two in sync — pinned by
        # tests/release/test_release_notes.py::test_ci_check_regex_matches_the_extractor):
        # an opening fence without a closing fence, or an empty block, would pass a looser
        # check here and then land in the draft as [needs edit].
        # When it fails, say what is wrong with THIS body rather than repeating the rule:
        # the common miss is a fenced block whose opening line has no release-note tag, or
        # has the note typed on the fence line itself, and "add a fenced block" reads as
        # nonsense to someone looking at the block they just wrote.
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          body = (event.get("pull_request") or {}).get("body") or ""
          match = re.search(r"^```release-note[ \t\r]*\n(.*?)^```[ \t\r]*$", body, re.DOTALL | re.IGNORECASE | re.MULTILINE)
          if match is not None and match.group(1).strip():
              print("release-note block found")
              sys.exit(0)
          want = "The release note goes in a fenced block that opens with exactly ```release-note, like this:%0A%0A```release-note%0AOne or two sentences a user can read.%0A```%0A%0AWrite none inside it for changes users never see."
          if match is not None:
              print(f"::error::The ```release-note block in the description is empty. {want}")
              sys.exit(1)
          near = re.search(r"^```([^\n`]*)$", body, re.MULTILINE)
          if near is not None and near.group(1).strip() and "release-note" not in near.group(1).lower():
              typed = near.group(1).strip()
              print(f"::error::A fenced block opens with ```{typed} and the harvester does not read that. {want}")
              sys.exit(1)
          print(f"::error::No ```release-note block found in the description. {want}")
          sys.exit(1)
          PY
