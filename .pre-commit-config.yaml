repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version. Keep in sync with the pinned dev dependency in pyproject.toml (ruff==0.16.3).
    rev: v0.16.3
    hooks:
      # Run the linter.
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
        types_or: [python, pyi]
  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos
  - repo: https://github.com/astral-sh/ty-pre-commit
    # ty version. Keep in sync with the pinned dev dependency in pyproject.toml (ty==0.0.72).
    rev: v0.0.72
    hooks:
      - id: ty
        # The hook runs `uv check`, which locks + syncs by default; isolated mode
        # keeps it from rewriting uv.lock / .venv with the hook's bundled uv.
        # --all-extras: pytest etc. live in the dev extra, which isolated mode
        # would otherwise omit (making tests/ imports unresolvable).
        args: [--isolated, --no-python-downloads, --all-extras]
